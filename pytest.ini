[pytest]
testpaths = . backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -p no:anyio
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    eval: code-based and judged eval-harness tests (backend/tests/eval_langchain/)
    llm: subset of eval tests that spend tokens or need a live model; excluded by the CI gate expression `eval and not llm`
