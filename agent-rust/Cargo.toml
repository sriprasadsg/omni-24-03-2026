[package]
name = "omni-agent"
version = "2.1.0"
edition = "2021"
description = "Enterprise OmniAgent — Rust edition"

[[bin]]
name = "omni-agent"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tokio   = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sysinfo    = "0.32"
chrono     = "0.4"
sha2    = "0.10"
hex     = "0.4"
walkdir = "2"
regex   = "1"
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
futures-util = "0.3.32"
once_cell = "1.19"
thiserror = "1.0"


# Windows-only dependencies — gated so the crate can `cargo check` on other hosts.
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
winreg = "0.52"
windows = { version = "0.58", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
ferrisetw = { version = "1.2.0", features = ["time_rs"] }

[profile.release]
opt-level    = "z"
lto          = true
# Unwind (not abort) so a panic in one background poller is caught by the in-process
# supervisor and that task restarts, instead of aborting the whole agent process.
panic        = "unwind"
codegen-units = 1
