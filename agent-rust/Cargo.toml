[package]
name = "omni-agent"
version = "2.1.0"
edition = "2021"
description = "Enterprise OmniAgent — Rust edition"

[[bin]]
name = "omni-agent"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tokio   = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sysinfo    = "0.32"
chrono     = "0.4"
windows-service = "0.7"
winreg = "0.52"
sha2    = "0.10"
hex     = "0.4"
walkdir = "2"
regex   = "1"
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
futures-util = "0.3.32"

[profile.release]
opt-level    = "z"
lto          = true
panic        = "abort"
codegen-units = 1
