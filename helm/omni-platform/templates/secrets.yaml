{{- if not .Values.secrets.existingSecret }}
{{- $secretName := printf "%s-secrets" (include "omni-platform.fullname" .) }}
{{- $prev := dict }}
{{- with (lookup "v1" "Secret" .Values.namespace.name $secretName) }}
{{- $prev = .data | default dict }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "omni-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  jwt-secret: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | b64enc | quote }}
  mongo-password: {{ required "secrets.mongoPassword is required" .Values.secrets.mongoPassword | b64enc | quote }}
  # Platform encryption keys. Every backend replica must share them (a key
  # generated per pod makes data encrypted on one pod unreadable on another),
  # so they live here rather than in the backend's local key file.
  encryption-key: {{ include "omni-platform.platformKey" (list $prev "encryption-key" .Values.secrets.encryptionKey "fernet") | quote }}
  cloud-credentials-key: {{ include "omni-platform.platformKey" (list $prev "cloud-credentials-key" .Values.secrets.cloudCredentialsKey "fernet") | quote }}
  integration-encryption-key: {{ include "omni-platform.platformKey" (list $prev "integration-encryption-key" .Values.secrets.integrationEncryptionKey "fernet") | quote }}
  vector-db-encryption-key: {{ include "omni-platform.platformKey" (list $prev "vector-db-encryption-key" .Values.secrets.vectorDbEncryptionKey "fernet") | quote }}
  payment-encryption-key: {{ include "omni-platform.platformKey" (list $prev "payment-encryption-key" .Values.secrets.paymentEncryptionKey "fernet") | quote }}
  email-encryption-key: {{ include "omni-platform.platformKey" (list $prev "email-encryption-key" .Values.secrets.emailEncryptionKey "fernet") | quote }}
  secrets-master-key: {{ include "omni-platform.platformKey" (list $prev "secrets-master-key" .Values.secrets.secretsMasterKey "master") | quote }}
{{- end }}
