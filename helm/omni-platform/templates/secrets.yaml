{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omni-platform.fullname" . }}-secrets
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "omni-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  jwt-secret: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | b64enc | quote }}
  mongo-password: {{ required "secrets.mongoPassword is required" .Values.secrets.mongoPassword | b64enc | quote }}
  encryption-key: {{ default (randAlphaNum 32) .Values.secrets.encryptionKey | b64enc | quote }}
{{- end }}
