<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise Omni-Agent AI Platform — Portfolio</title>
<style>
  :root {
    --cyan:   #00e5ff;
    --green:  #00ff88;
    --purple: #7c3aed;
    --dark:   #050a14;
    --dark2:  #0a1628;
    --dark3:  #0f2040;
    --border: #1e3a5f;
    --text:   #c8e0f4;
    --muted:  #5a7fa8;
    --red:    #ff4c6a;
    --orange: #ff8c00;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; }

  body {
    background: var(--dark);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--text);
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none; z-index: 0;
  }

  /* ── Header ────────────────────────────────────────────────────────── */
  #header {
    position: relative; z-index: 10;
    width: 100%;
    padding: clamp(8px,1.5vh,16px) 16px clamp(6px,1vh,12px);
    text-align: center;
    flex-shrink: 0;
  }
  #header h1 {
    font-size: clamp(9px,1.1vw,13px);
    font-weight: 700;
    letter-spacing: clamp(1px,0.3vw,3px);
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #header span { color: var(--cyan); }

  /* ── Stage ─────────────────────────────────────────────────────────── */
  #stage {
    position: relative; z-index: 1;
    flex: 1 1 0;
    width: 100%;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }

  /* ── Scene: natural 680×500, scaled by JS ──────────────────────────── */
  #scene {
    position: relative;
    width: 680px;
    height: 500px;
    flex-shrink: 0;
    transform-origin: center center;
  }

  /* ── Book wrapper: translates to centre single cover page ──────────── */
  #book-wrapper {
    position: absolute;
    top: 0; left: 0;
    width: 680px; height: 460px;
    /* shift right so the right half (cover) is centred */
    transform: translateX(-170px);
    transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #book-wrapper.open { transform: translateX(0); }

  /* ── Book ───────────────────────────────────────────────────────────── */
  #book {
    position: relative;
    width: 680px; height: 460px;
    /* perspective for the flipper 3D effect */
    perspective: 1800px;
  }

  /* ── Static panels ──────────────────────────────────────────────────── */
  .panel {
    position: absolute;
    top: 0; width: 340px; height: 460px;
    background: linear-gradient(145deg, var(--dark2) 0%, var(--dark3) 100%);
    overflow: hidden;
  }
  .panel::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--cyan), var(--purple), var(--green));
  }

  #left-panel  {
    left: 0;
    border: 1px solid var(--border);
    border-right: none;
    border-radius: 6px 0 0 6px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #left-panel.visible { opacity: 1; }
  #left-panel::before {
    background: linear-gradient(90deg, var(--green), var(--purple), var(--cyan));
  }

  #right-panel {
    left: 340px;
    border: 1px solid var(--border);
    border-left: none;
    border-radius: 0 6px 6px 0;
    cursor: pointer;
  }
  #right-panel::before {
    background: linear-gradient(90deg, var(--purple), var(--cyan), var(--green));
  }

  /* panel content wrappers */
  #left-content, #right-content {
    width: 100%; height: 100%;
  }

  /* ── Spine ───────────────────────────────────────────────────────────── */
  #spine {
    position: absolute;
    left: 335px; top: 0;
    width: 10px; height: 460px;
    background: linear-gradient(to right, #030810, #0a1e3d, #030810);
    border-left:  1px solid var(--border);
    border-right: 1px solid var(--border);
    z-index: 20;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #spine.visible { opacity: 1; }

  /* ── Page-stack edge (right side of cover) ──────────────────────────── */
  #page-stack {
    position: absolute;
    right: -5px; top: 3px;
    width: 5px; height: 454px;
    background: repeating-linear-gradient(
      to bottom,
      var(--dark3) 0px, var(--dark3) 2px,
      var(--border) 2px, var(--border) 3px
    );
    border-radius: 0 2px 2px 0;
    opacity: 1;
    transition: opacity 0.4s ease;
  }

  /* ── Flipper ─────────────────────────────────────────────────────────── */
  #flipper {
    position: absolute;
    top: 0; height: 460px;
    transform-style: preserve-3d;
    z-index: 50;
    display: none;
  }

  .fface {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
  }
  /* Back face is pre-rotated 180deg so it appears normal when container hits ±180deg */
  .fback { transform: rotateY(180deg); }

  /* Drop shadow underneath flipping page */
  #flipper::after {
    content: '';
    position: absolute;
    bottom: -8px; left: 10%; width: 80%; height: 16px;
    background: radial-gradient(ellipse, rgba(0,0,0,0.5) 0%, transparent 70%);
    filter: blur(6px);
    transform: rotateX(90deg);
    transform-origin: bottom center;
  }

  /* ── Click zones (above flipper, pointer events) ────────────────────── */
  .click-zone {
    position: absolute; top: 0; height: 460px; z-index: 100;
  }
  #zone-right { left: 340px; width: 340px; cursor: pointer; }
  #zone-left  { left: 0;     width: 340px; cursor: pointer; }

  /* Hover arrow hints */
  #zone-right::after, #zone-left::after {
    content: '';
    position: absolute; top: 50%;
    width: 28px; height: 28px;
    border: 2px solid rgba(0,229,255,0.35);
    border-radius: 50%;
    transform: translateY(-50%);
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  #zone-right::after { right: 16px; }
  #zone-left::after  { left: 16px; }
  #zone-right:hover::after { opacity: 1; }
  #zone-left:hover::after  { opacity: 1; }

  /* ── Book shadow ─────────────────────────────────────────────────────── */
  #book-shadow {
    position: absolute;
    bottom: -30px; left: 50%;
    transform: translateX(-50%);
    width: 580px; height: 40px;
    background: radial-gradient(ellipse, rgba(0,0,0,0.7) 0%, transparent 70%);
    filter: blur(8px);
  }

  /* ═══════════════════════════════════════════════════════════════════════
     PAGE FACE STYLES (content inside both static panels and flipper faces)
     ═══════════════════════════════════════════════════════════════════════ */

  .page-face {
    width: 100%; height: 100%;
    background: linear-gradient(145deg, var(--dark2) 0%, var(--dark3) 100%);
    padding: 22px 20px;
    display: flex; flex-direction: column; gap: 10px;
    position: relative; overflow: hidden;
  }
  .page-face::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--cyan), var(--purple), var(--green));
  }

  .page-title {
    font-size: 11px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--cyan); margin-bottom: 2px;
  }
  .page-number {
    position: absolute; bottom: 10px;
    font-size: 10px; color: var(--muted); letter-spacing: 1px;
  }
  .page-number.left  { left: 16px; }
  .page-number.right { right: 16px; }

  h1.hero    { font-size: 22px; font-weight: 800; line-height: 1.2; color: #fff; }
  h2.section { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  p.body     { font-size: 10px; line-height: 1.6; color: var(--text); }
  p.small    { font-size: 9px;  line-height: 1.5; color: var(--muted); }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 2px 0;
  }

  .feat-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex: 1;
  }
  .feat-card {
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 5px; padding: 7px 9px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .feat-card .icon  { font-size: 14px; }
  .feat-card .label { font-size: 9px; font-weight: 600; color: var(--text); }
  .feat-card .desc  { font-size: 8px; color: var(--muted); line-height: 1.4; }

  .stats-row { display: flex; gap: 7px; }
  .stat-box {
    flex: 1;
    background: rgba(0,255,136,0.04);
    border: 1px solid rgba(0,255,136,0.2);
    border-radius: 7px; padding: 7px 5px; text-align: center;
  }
  .stat-box .num { font-size: 18px; font-weight: 800; color: var(--green); line-height: 1; }
  .stat-box .lbl { font-size: 8px; color: var(--muted); margin-top: 2px; line-height: 1.3; }

  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    padding: 2px 7px; border-radius: 20px;
    font-size: 8px; font-weight: 600;
    letter-spacing: 0.5px; text-transform: uppercase;
  }
  .tag.cyan   { background: rgba(0,229,255,0.12);  color: var(--cyan);   border: 1px solid rgba(0,229,255,0.3); }
  .tag.green  { background: rgba(0,255,136,0.1);   color: var(--green);  border: 1px solid rgba(0,255,136,0.25); }
  .tag.purple { background: rgba(124,58,237,0.15); color: #a78bfa;       border: 1px solid rgba(124,58,237,0.35); }
  .tag.red    { background: rgba(255,76,106,0.1);  color: var(--red);    border: 1px solid rgba(255,76,106,0.25); }
  .tag.orange { background: rgba(255,140,0,0.1);   color: var(--orange); border: 1px solid rgba(255,140,0,0.25); }

  .list-items { display: flex; flex-direction: column; gap: 5px; }
  .list-item {
    display: flex; align-items: flex-start; gap: 7px;
    padding: 5px 7px;
    background: rgba(255,255,255,0.02);
    border-radius: 4px; border-left: 2px solid var(--cyan);
  }
  .list-item .dot  { width: 5px; height: 5px; border-radius: 50%; background: var(--cyan); margin-top: 4px; flex-shrink: 0; }
  .list-item .text { font-size: 9px; line-height: 1.5; color: var(--text); }

  .progress-row  { display: flex; flex-direction: column; gap: 5px; }
  .progress-item { display: flex; flex-direction: column; gap: 2px; }
  .progress-label{ display: flex; justify-content: space-between; font-size: 8px; color: var(--muted); }
  .progress-bar  { height: 3px; background: rgba(255,255,255,0.07); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--cyan), var(--green)); }

  .cover-bg {
    background: linear-gradient(135deg, #050f1f 0%, #0a1e40 50%, #051228 100%) !important;
  }
  .cover-bg::after {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 70% 30%, rgba(0,229,255,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 20% 80%, rgba(124,58,237,0.08) 0%, transparent 50%);
    pointer-events: none;
  }
  .cover-logo {
    width: 44px; height: 44px; border-radius: 11px;
    background: linear-gradient(135deg, #0a2a50, #1a4a80);
    border: 1px solid var(--cyan);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; position: relative; z-index: 1;
    box-shadow: 0 0 20px rgba(0,229,255,0.3);
  }
  .cover-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(0,229,255,0.08); border: 1px solid rgba(0,229,255,0.25);
    border-radius: 20px; padding: 3px 10px;
    font-size: 8px; font-weight: 600; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--cyan); position: relative; z-index: 1;
  }
  .cover-badge::before {
    content: ''; width: 5px; height: 5px; border-radius: 50%;
    background: var(--green); animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50%      { opacity:.5; transform:scale(.8); }
  }
  .hex-grid {
    position: absolute; bottom: 24px; right: 0;
    width: 140px; height: 120px; opacity: 0.08; z-index: 0;
  }
  @keyframes shimmer {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  .shimmer-line {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.03) 50%, transparent 100%);
    animation: shimmer 3s infinite;
  }

  .arch-layer {
    background: rgba(0,229,255,0.03); border: 1px solid rgba(0,229,255,0.15);
    border-radius: 5px; padding: 5px 8px;
  }
  .arch-layer .layer-title {
    font-size: 8px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--cyan); margin-bottom: 3px;
  }
  .arch-layer .layer-items { display: flex; flex-wrap: wrap; gap: 3px; }

  /* Open-book hint on cover */
  .open-hint {
    position: absolute; bottom: 22px; right: 16px;
    display: flex; align-items: center; gap: 6px;
    font-size: 9px; color: var(--muted); letter-spacing: 1px;
    animation: hint-pulse 2.5s ease-in-out infinite;
    z-index: 1;
  }
  .open-hint svg { width: 14px; height: 14px; }
  @keyframes hint-pulse {
    0%,100% { opacity:.4; transform: translateX(0); }
    50%      { opacity:.9; transform: translateX(3px); }
  }

  /* ── Navigation ─────────────────────────────────────────────────────── */
  #nav {
    position: relative; z-index: 10;
    flex-shrink: 0;
    padding: clamp(8px,1.5vh,18px) 16px;
    display: flex; align-items: center;
    gap: clamp(10px,2vw,20px);
    flex-wrap: wrap; justify-content: center;
  }
  .nav-btn {
    width: clamp(36px,4vw,42px); height: clamp(36px,4vw,42px);
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(10,22,40,0.8);
    color: var(--cyan);
    font-size: clamp(14px,1.5vw,17px);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; backdrop-filter: blur(10px);
    touch-action: manipulation;
  }
  .nav-btn:hover {
    background: rgba(0,229,255,0.1); border-color: var(--cyan);
    box-shadow: 0 0 14px rgba(0,229,255,0.2);
  }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .page-dots { display: flex; gap: 5px; align-items: center; }
  .page-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--border); transition: all 0.3s; cursor: pointer;
  }
  .page-dot.active {
    background: var(--cyan); width: 16px; border-radius: 3px;
    box-shadow: 0 0 7px rgba(0,229,255,0.5);
  }

  /* ── Tip ─────────────────────────────────────────────────────────────── */
  #tip {
    position: fixed; bottom: 10px; left: 50%;
    transform: translateX(-50%);
    font-size: clamp(9px,1vw,11px); color: var(--muted);
    letter-spacing: 1px; z-index: 20;
    opacity: 1; transition: opacity 0.5s;
    white-space: nowrap; pointer-events: none;
  }
  #tip.hidden { opacity: 0; }
</style>
</head>
<body>

<div id="header">
  <h1>Enterprise <span>Omni-Agent</span> AI Platform &nbsp;&middot;&nbsp; <span>Exafluence Inc.</span> &nbsp;&middot;&nbsp; Edition 2030</h1>
</div>

<div id="stage">
  <div id="scene">
    <div id="book-wrapper">
      <div id="book">

        <!-- Left static page -->
        <div class="panel" id="left-panel">
          <div id="left-content"></div>
        </div>

        <!-- Spine -->
        <div id="spine"></div>

        <!-- Right static page -->
        <div class="panel" id="right-panel">
          <div id="page-stack"></div>
          <div id="right-content"></div>
        </div>

        <!-- Animated page flipper -->
        <div id="flipper">
          <div class="fface ffront" id="flipper-front"></div>
          <div class="fface fback"  id="flipper-back"></div>
        </div>

        <!-- Click zones (above everything) -->
        <div class="click-zone" id="zone-right" onclick="handleClick('right')"></div>
        <div class="click-zone" id="zone-left"  onclick="handleClick('left')"></div>

      </div>
      <div id="book-shadow"></div>
    </div>
  </div>
</div>

<div id="nav">
  <button class="nav-btn" id="btn-prev" onclick="turnBackward()">&#8592;</button>
  <div class="page-dots" id="dots"></div>
  <button class="nav-btn" id="btn-next" onclick="turnForward()">&#8594;</button>
</div>

<div id="tip">Click the page to turn &nbsp;&middot;&nbsp; Keyboard &#8592; &#8594; &nbsp;&middot;&nbsp; Swipe</div>

<script>
// ─── Page content (each entry = one leaf: front=right-side, back=left-side after flip) ─

const PAGES = [
  // 0 — Cover / Overview
  {
    front: `<div class="page-face cover-bg">
      <div class="shimmer-line"></div>
      <svg class="hex-grid" viewBox="0 0 140 120" fill="none">
        ${Array.from({length:12},(_,i)=>{const x=(i%4)*34+17,y=Math.floor(i/4)*38+(i%2?19:0);return`<polygon points="${x},${y-11} ${x+9},${y-5} ${x+9},${y+5} ${x},${y+11} ${x-9},${y+5} ${x-9},${y-5}" stroke="#00e5ff" stroke-width="1" fill="none" opacity="0.6"/>`;}).join('')}
      </svg>
      <div style="position:relative;z-index:1;display:flex;flex-direction:column;gap:14px;height:100%">

        <div class="cover-badge">Live Platform &#8212; All Systems Go</div>
        <h1 class="hero" style="font-size:18px;line-height:1.25;color:#fff">Enterprise<br><span style="color:var(--cyan)">Omni-Agent</span><br>AI Platform</h1>
        <div class="divider"></div>
        <p class="small" style="color:var(--muted);line-height:1.6">

          <div class="stat-box"><div class="num">100%</div><div class="lbl">Test<br>Pass Rate</div></div>
        </div>
      </div>
      <div class="open-hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        click to open
      </div>
    </div>`,
    back: `<div class="page-face">
      <p class="page-title">Platform Overview</p>
      <h2 class="section" style="font-size:12px">What is Omni-Agent?</h2>

        <div class="list-item"><div class="dot" style="background:var(--green)"></div><div class="text"><strong>Unified SOC</strong> &#8212; EDR, SIEM, UEBA, SOAR in one pane of glass</div></div>

        <div class="list-item"><div class="dot" style="background:var(--orange)"></div><div class="text"><strong>Zero Trust + PAM</strong> &#8212; Device trust scores, privileged access vaulting</div></div>
        <div class="list-item"><div class="dot" style="background:var(--red)"></div><div class="text"><strong>Multi-Cloud CSPM</strong> &#8212; AWS, Azure, GCP posture management at scale</div></div>
      </div>
      <div style="margin-top:auto">
        <div class="tags">
          <span class="tag cyan">FastAPI</span><span class="tag cyan">React</span>
          <span class="tag green">MongoDB</span><span class="tag purple">Socket.IO</span>
          <span class="tag orange">Python 3.11+</span>
        </div>
      </div>
      <p class="page-number left">2</p>
    </div>`
  },

  // 1 — Agent Fleet / Capabilities
  {
    front: `<div class="page-face">
      <p class="page-title">Agent Fleet</p>
      <h2 class="section">Autonomous Agent Management</h2>
      <p class="body" style="margin-bottom:6px">Deploy, manage, and orchestrate thousands of autonomous agents. Each agent reports telemetry, executes playbooks, and participates in swarm coordination.</p>
      <div class="feat-grid">
        <div class="feat-card"><span class="icon">&#x1F916;</span><div class="label">Agent Registry</div><div class="desc">Full fleet inventory with health, capabilities, last-seen</div></div>
        <div class="feat-card"><span class="icon">&#x1F578;</span><div class="label">Swarm Mode</div><div class="desc">Peer-to-peer coordination for distributed response</div></div>
        <div class="feat-card"><span class="icon">&#x1F9E0;</span><div class="label">Agentic Decisions</div><div class="desc">AI-driven autonomous decisions with approval workflows</div></div>
        <div class="feat-card"><span class="icon">&#x26A1;</span><div class="label">Remote Control</div><div class="desc">Real-time shell, file browser, process manager</div></div>
        <div class="feat-card"><span class="icon">&#x1F3AF;</span><div class="label">Goal System</div><div class="desc">Persistent goal manager drives security objectives</div></div>

// ─── State ────────────────────────────────────────────────────────────────────

const N = PAGES.length; // 9 leaves → states 0..N

let state       = 0;   // 0 = cover only, N = back cover
let isAnimating = false;

// ─── DOM refs ─────────────────────────────────────────────────────────────────

const scene       = document.getElementById('scene');
const stage       = document.getElementById('stage');
const bookWrapper = document.getElementById('book-wrapper');
const leftPanel   = document.getElementById('left-panel');
const rightPanel  = document.getElementById('right-panel');
const leftContent = document.getElementById('left-content');
const rightContent= document.getElementById('right-content');
const spine       = document.getElementById('spine');
const pageStack   = document.getElementById('page-stack');
const flipper     = document.getElementById('flipper');
const flipFront   = document.getElementById('flipper-front');
const flipBack    = document.getElementById('flipper-back');
const zoneRight   = document.getElementById('zone-right');
const zoneLeft    = document.getElementById('zone-left');
const dotsEl      = document.getElementById('dots');
const btnPrev     = document.getElementById('btn-prev');
const btnNext     = document.getElementById('btn-next');
const tip         = document.getElementById('tip');

// ─── Helpers ──────────────────────────────────────────────────────────────────

function leftFace(s)  { return s === 0   ? null : PAGES[s-1].back; }
function rightFace(s) { return s === N   ? null : PAGES[s].front;  }

// ─── Render (static state, no animation) ─────────────────────────────────────

function render(s) {
  // Left panel
  const lf = leftFace(s);
  leftContent.innerHTML  = lf || '';
  leftPanel.classList.toggle('visible', !!lf);

  // Right panel
  const rf = rightFace(s);
  rightContent.innerHTML = rf || '';

  // Structural toggles
  bookWrapper.classList.toggle('open',    s > 0);
  spine.classList.toggle('visible',       s > 0);
  pageStack.style.opacity = s === 0 ? '1' : '0';

  // Nav
  btnPrev.disabled = s === 0;
  btnNext.disabled = s === N;
  zoneLeft.style.cursor  = s > 0 && !isAnimating ? 'pointer' : 'default';
  zoneRight.style.cursor = s < N && !isAnimating ? 'pointer' : 'default';

  // Dots
  dotsEl.querySelectorAll('.page-dot').forEach((d, i) => {
    d.classList.toggle('active', i === s);
  });
}

// ─── Forward flip (right page turns to become left page) ─────────────────────

function turnForward() {
  if (isAnimating || state >= N) return;
  isAnimating = true;

  const ffHTML = PAGES[state].front;  // current right page (flies across)
  const fbHTML = PAGES[state].back;   // new left page (back of the flipping leaf)
  const nextRF = state + 1 < N ? PAGES[state + 1].front : '';

  // Flipper sits over the right panel (x=340), hinge at its left edge (spine)
  flipper.style.cssText = `
    display: block;
    left: 340px; width: 340px;
    transform-origin: left center;
    transform: rotateY(0deg);
    transition: none;
  `;
  flipFront.innerHTML = ffHTML;
  flipBack.innerHTML  = fbHTML;

  // Pre-load next right page behind the flipper
  rightContent.innerHTML = nextRF;

  // One rAF to allow display:block to paint, then animate
  requestAnimationFrame(() => requestAnimationFrame(() => {
    flipper.style.transition = 'transform 0.75s cubic-bezier(0.645, 0.045, 0.355, 1)';
    flipper.style.transform  = 'rotateY(-180deg)';
  }));

  setTimeout(() => {
    state++;
    flipper.style.display = 'none';
    flipper.style.transition = '';
    render(state);
    isAnimating = false;
  }, 780);
}

// ─── Backward flip (left page turns back to become right page) ───────────────

function turnBackward() {
  if (isAnimating || state <= 0) return;
  isAnimating = true;

  const ffHTML = PAGES[state-1].back;   // current left page (flies across)
  const fbHTML = PAGES[state-1].front;  // new right page
  const prevLF = state - 1 === 0 ? null : PAGES[state-2].back;

  // Flipper sits over the left panel (x=0), hinge at its right edge (spine)
  flipper.style.cssText = `
    display: block;
    left: 0; width: 340px;
    transform-origin: right center;
    transform: rotateY(0deg);
    transition: none;
  `;
  flipFront.innerHTML = ffHTML;
  flipBack.innerHTML  = fbHTML;

  // Pre-load new left content behind the flipper
  leftContent.innerHTML = prevLF || '';
  leftPanel.classList.toggle('visible', !!prevLF);

  requestAnimationFrame(() => requestAnimationFrame(() => {
    flipper.style.transition = 'transform 0.75s cubic-bezier(0.645, 0.045, 0.355, 1)';
    flipper.style.transform  = 'rotateY(180deg)';
  }));

  setTimeout(() => {
    state--;
    flipper.style.display = 'none';
    flipper.style.transition = '';
    render(state);
    isAnimating = false;
  }, 780);
}

// ─── Click handler ────────────────────────────────────────────────────────────

function handleClick(side) {
  if (side === 'right') turnForward();
  else                  turnBackward();
}

// ─── Dots ─────────────────────────────────────────────────────────────────────

for (let i = 0; i <= N; i++) {
  const d = document.createElement('div');
  d.className = 'page-dot';
  d.onclick = () => jumpTo(i);
  dotsEl.appendChild(d);
}

function jumpTo(target) {
  if (target === state || isAnimating) return;
  // Jump without animation for multi-page skips via dots
  state = target;
  render(state);
}

// ─── Keyboard ─────────────────────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') turnForward();
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   turnBackward();
});

// ─── Touch swipe ──────────────────────────────────────────────────────────────

let tx = 0, ty = 0;
document.addEventListener('touchstart', e => { tx = e.changedTouches[0].screenX; ty = e.changedTouches[0].screenY; }, {passive:true});
document.addEventListener('touchend',   e => {
  const dx = e.changedTouches[0].screenX - tx;
  const dy = e.changedTouches[0].screenY - ty;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
    if (dx < 0) turnForward(); else turnBackward();
  }
}, {passive:true});

// ─── Responsive scale ─────────────────────────────────────────────────────────

const BOOK_W = 680, BOOK_H = 500;

function rescale() {
  const pad = 16;
  const sc = Math.min((stage.clientWidth - pad) / BOOK_W, (stage.clientHeight - pad) / BOOK_H, 1.0);
  scene.style.transform = `scale(${sc})`;
}
window.addEventListener('resize', rescale);
requestAnimationFrame(() => requestAnimationFrame(rescale));

// ─── Boot ─────────────────────────────────────────────────────────────────────

render(0);
setTimeout(() => tip.classList.add('hidden'), 5000);
</script>
</body>
