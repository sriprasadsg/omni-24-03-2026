# Passive 7-day check: ET Open scan rules to switch on with suricata-update.
#
# ET Open ships these disabled. Without them an nmap SYN scan raises only a few port-specific alerts
# and a port-445 sweep raises none (dry run 2026-11-15, Suricata 7.0.3, ET Open for 7.0.3).
#
#   cp enable.conf /etc/suricata/enable.conf && suricata-update
#
# suricata-update's log must say "Enabled 17 rules". Every sid below existed, disabled, in that ruleset.
# Most of these alert once per destination address and the GPL ones once per packet, so one sweep of a /24
# is about 254 alerts from a single source. Count the scanner, not its targets, when reading the tables.
#
# Left out on purpose:
#   2002911 ET SCAN Potential VNC Scan 5900-5920: needs flow:established with flags:S, so it never fires.
#   2001329 ET INFO RDP connection request: fires on every RDP login, not on scans.

