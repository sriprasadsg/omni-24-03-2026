<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#060a14" />
  <meta name="apple-mobile-web-app-title" content="Omni-Agent" />
  <script src="/theme-init.js"></script>
  <title>Omni-Agent AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&family=JetBrains+Mono:wght@400..600&display=swap" rel="stylesheet">

  <style>
    @keyframes checkmark-path-draw {
      0% {
        stroke-dashoffset: 25;
      }

      100% {
        stroke-dashoffset: 0;
      }
    }

    .checkmark-path-animated {
      stroke-dasharray: 25;
      stroke-dashoffset: 25;
      animation: checkmark-path-draw 0.4s ease-in-out forwards;
    }

    @keyframes checkmark-circle-pop {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.2);
      }

      100% {
        transform: scale(1);
      }
    }

    .checkmark-circle-pop-animated {
      animation: checkmark-circle-pop 0.3s ease-in-out;
    }
  </style>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
