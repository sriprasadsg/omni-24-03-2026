version: "3.9"
# Usage:
#   Development:  docker compose up
#   Production:   docker compose --profile production up -d (uses nginx + built frontend)

services:
  # ── MongoDB ────────────────────────────────────────────────
  mongo:
    image: mongo:8.0  # TODO: pin to digest for production
    container_name: omniagent-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-omniagent}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: omniagent
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (rate limiting & caching) ───────────────────────
  redis:
    image: redis:8.0-alpine  # TODO: pin to digest for production
    container_name: omniagent-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --bind 0.0.0.0
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── FastAPI Backend ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omniagent-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # ARCH-002: the application reads MONGODB_URL (backend/database.py);
      # it now also accepts MONGO_URI as a fallback, but this is set to the
      # name the app documents as primary so the two never drift again.
      - MONGODB_URL=mongodb://${MONGO_ROOT_USER:-omniagent}:${MONGO_ROOT_PASSWORD}@mongo:27017/omniagent
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app:ro
      - backend_uploads:/app/uploads
      - backend_static_reports:/app/static/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Vite Frontend ──────────────────────────────────────────
  frontend:
    image: node:24-alpine  # TODO: pin to digest for production
    container_name: omniagent-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    env_file:
      - .env
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
      - VITE_WS_URL=ws://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  # ── Production Frontend (nginx, built assets) ─────────────
  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile.frontend.prod
    container_name: omniagent-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - production

  # ── Demo Data Seeder (one-shot) ────────────────────────────
  seeder:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omniagent-seeder
    restart: "no"
    command: python seed_demo_data.py
    env_file:
      - .env
    environment:
      - MONGODB_URL=mongodb://mongo:27017/omniagent
    depends_on:
      mongo:
        condition: service_healthy
    profiles:
      - seed

volumes:
  mongo_data:
  node_modules:
  backend_uploads:
  backend_static_reports:
