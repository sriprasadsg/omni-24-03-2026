name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .

      - name: Security scan (bandit)
        run: |
          pip install bandit[toml]
          bandit -r . -ll -x ./tests,./scripts -f json -o bandit-report.json || true
          bandit -r . -ll -x ./tests,./scripts

      - name: Type check (pyright)
        run: |
          pip install pyright
          pyright --pythonversion 3.13

      - name: Dependency vulnerability check (safety)
        run: |
          pip install safety
          safety check -r requirements.txt --ignore 70612
        continue-on-error: true

      - name: Run tests
        env:
          # Generate with: python -c "import secrets; print(secrets.token_urlsafe(64))" and set as a GitHub repo secret
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          MONGODB_URL: mongodb://localhost:27017
        run: |
          pip install pytest pytest-asyncio httpx slowapi pytest-cov
          pytest tests/ --tb=short -q --cov=. --cov-report=term-missing --cov-fail-under=30

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017

  # ── Secret scan ────────────────────────────────────────────────────────────
  # Fails the build when a push/PR introduces a credential. Only the new
  # commits are scanned: older history already contains leaked credentials
  # that were rotated, so a full-history scan would fail on every run.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          V=8.18.4
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz\$" "gitleaks_${V}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks

      - name: Scan new commits
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="$BASE_SHA..HEAD"
          fi
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --log-opts="$RANGE"

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend lint, type-check & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npx eslint . --max-warnings 0

      - name: Unit tests
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          VITE_PROXY_TARGET: http://localhost:5010

      - name: Dependency audit (npm audit)
        run: npm audit --audit-level=high

  # ── Rust agent ─────────────────────────────────────────────────────────────
  rust-agent:
    name: Rust agent build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent-install/omni-agent-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('agent-install/omni-agent-rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build agent (Windows)
        run: cd agent-install/omni-agent-rs && cargo build --release --target x86_64-pc-windows-gnu

  # ── Docker build ───────────────────────────────────────────────────────────
  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend, rust-agent]
    # ARCH-014: previously gated to main-only, which meant this job — and the
    # broken Dockerfile.backend path below it — never ran on a single PR.
    # Runs on every push/PR now so an image build failure is visible before
    # merge, not after.

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t omni-backend:ci ./backend

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t omni-frontend:ci .
