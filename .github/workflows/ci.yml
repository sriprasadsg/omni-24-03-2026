name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .

      - name: Security scan (bandit)
        run: |
          pip install bandit[toml]
          bandit -r . -ll -x ./tests,./scripts -f json -o bandit-report.json || true
          bandit -r . -ll -x ./tests,./scripts

      - name: Type check (pyright)
        run: |
          pip install pyright
          pyright --pythonversion 3.13

      - name: Dependency vulnerability check (safety)
        run: |
          pip install safety
          safety check -r requirements.txt --ignore 70612
        continue-on-error: true

      - name: Run tests
        env:
          # Generate with: python -c "import secrets; print(secrets.token_urlsafe(64))" and set as a GitHub repo secret
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          MONGODB_URL: mongodb://localhost:27017
        run: |
          pip install pytest pytest-asyncio httpx slowapi pytest-cov
          pytest tests/ --tb=short -q --cov=. --cov-report=term-missing --cov-fail-under=30

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend lint, type-check & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npx eslint . --max-warnings 0

      - name: Build
        run: npm run build
        env:
          VITE_PROXY_TARGET: http://localhost:5010

      - name: Dependency audit (npm audit)
        run: npm audit --audit-level=high

  # ── Rust agent ─────────────────────────────────────────────────────────────
  rust-agent:
    name: Rust agent build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent-rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('agent-rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build agent (Windows)
        run: cd agent-rust && cargo build --release --target x86_64-pc-windows-gnu

  # ── Docker build ───────────────────────────────────────────────────────────
  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend, rust-agent]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t omni-backend:ci .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t omni-frontend:ci .
