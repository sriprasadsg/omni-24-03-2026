name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .

      - name: Type check (pyright)
        run: |
          pip install pyright
          pyright --pythonversion 3.14 || true

      - name: Run tests
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-test-secret-key-not-for-production' }}
          MONGODB_URL: mongodb://localhost:27017
        run: |
          pip install pytest pytest-asyncio httpx
          pytest --tb=short -q || true   # non-blocking until test suite is added

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend lint, type-check & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npx eslint . --ext .ts,.tsx --max-warnings 0 || true

      - name: Build
        run: npm run build
        env:
          VITE_PROXY_TARGET: http://localhost:5010

  # ── Docker build ───────────────────────────────────────────────────────────
  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t omni-backend:ci . || true

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t omni-frontend:ci . || true
