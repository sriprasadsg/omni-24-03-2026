[tool.bandit]
exclude_dirs = ["tests", "scripts", "uploads"]
# Baseline gate: fail on genuinely dangerous findings, accept the following
# medium-severity classes that are intentional or advisory for this service.
skips = [
    "B101",  # assert_used — acceptable in non-test code
    "B104",  # hardcoded_bind_all_interfaces — the API intentionally binds 0.0.0.0 in-container
    "B108",  # hardcoded_tmp_directory — controlled, non-sensitive temp path use
    "B113",  # request_without_timeout — advisory reliability nit, not a vuln (low confidence)
    "B310",  # urllib urlopen — invoked only on server-controlled, non-user URLs
    "B314",  # xml parse — parses server-generated/controlled XML, not untrusted input
    "B615",  # huggingface download without revision pin — model source is trusted/self-hosted
]
