<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Shared file</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0f172a; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 28px; width: 360px; max-width: 90vw; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { font-size: 13px; color: #94a3b8; margin: 0 0 18px; }
  input { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #475569;
          background: #0f172a; color: #e2e8f0; margin-bottom: 12px; }
  button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { margin-top: 12px; font-size: 13px; }
  .err { color: #f87171; } .ok { color: #4ade80; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <h1>Shared file</h1>
  <p>Someone shared a file with you through a secure, time-limited link.</p>
  <div id="password-row" hidden>
    <input id="password" type="password" placeholder="Password" autocomplete="off">
  </div>
  <button id="download">Download</button>
  <div id="msg" class="msg" role="status"></div>
</div>
<script src="/static/shared.js"></script>
</body>
</html>
