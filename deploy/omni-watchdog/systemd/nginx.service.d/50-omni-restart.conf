# Optional. Install as /etc/systemd/system/nginx.service.d/50-omni-restart.conf. systemd then restarts
# a crashed process within 5 seconds; the watchdog handles hangs. Delete the file to undo it.
# A new file name on purpose: it must never replace another drop-in of this unit.
[Service]
Restart=on-failure
RestartSec=5s
