# Install as /etc/systemd/system/omni-backend.service.d/10-omni-watchdog.conf, then daemon-reload and
# restart the backend (operator step, see INSTALL.md). systemd hands the token to the backend as
# $CREDENTIALS_DIRECTORY/omni-watchdog-token, so the backend's own user never needs to read the file.
[Service]
LoadCredential=omni-watchdog-token:/etc/omni-watchdog/ingest.token
