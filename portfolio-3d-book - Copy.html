<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise Omni-Agent AI Platform — Portfolio</title>
<style>
  :root {
    --cyan: #00e5ff;
    --green: #00ff88;
    --purple: #7c3aed;
    --dark: #050a14;
    --dark2: #0a1628;
    --dark3: #0f2040;
    --card: #0d1e35;
    --border: #1e3a5f;
    --text: #c8e0f4;
    --muted: #5a7fa8;
    --red: #ff4c6a;
    --orange: #ff8c00;
    --yellow: #ffd700;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text);
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Glow orbs */
  body::after {
    content: '';
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,229,255,0.05) 0%, transparent 70%);
    top: -200px; left: -200px;
    pointer-events: none;
    z-index: 0;
  }

  #scene {
    perspective: 2000px;
    position: relative;
    z-index: 1;
  }

  #book {
    width: 680px;
    height: 460px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.3s ease;
  }

  /* Book shadow */
  #book-shadow {
    position: absolute;
    bottom: -30px;
    left: 50%;
    transform: translateX(-50%);
    width: 580px;
    height: 40px;
    background: radial-gradient(ellipse, rgba(0,0,0,0.8) 0%, transparent 70%);
    filter: blur(8px);
    z-index: 0;
  }

  /* Pages */
  .page {
    position: absolute;
    width: 340px;
    height: 460px;
    top: 0;
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.645, 0.045, 0.355, 1.000);
    border-radius: 2px 6px 6px 2px;
  }

  .page .front, .page .back {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 2px 6px 6px 2px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .page .back {
    transform: rotateY(180deg);
    border-radius: 6px 2px 2px 6px;
  }

  /* Page face styling */
  .page-face {
    width: 100%;
    height: 100%;
    background: linear-gradient(145deg, var(--dark2) 0%, var(--dark3) 100%);
    border: 1px solid var(--border);
    padding: 24px 22px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
  }

  .page-face::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--cyan), var(--purple), var(--green));
  }

  /* Page turned */
  .page.turned {
    transform: rotateY(-180deg);
  }

  /* Book spine */
  #spine {
    position: absolute;
    left: 340px;
    top: 0;
    width: 8px;
    height: 460px;
    background: linear-gradient(to right, #051022, #0a1e3d, #051022);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    z-index: 100;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
  }

  /* Right half (static backing) */
  #right-cover {
    position: absolute;
    left: 348px;
    top: 0;
    width: 332px;
    height: 460px;
    background: linear-gradient(145deg, var(--dark2) 0%, var(--dark3) 100%);
    border: 1px solid var(--border);
    border-radius: 2px 6px 6px 2px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #right-cover::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--purple), var(--cyan), var(--green));
  }

  #right-cover-inner {
    width: 100%;
    height: 100%;
    padding: 24px 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow: hidden;
  }

  /* Typography */
  .page-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: 4px;
  }

  .page-number {
    position: absolute;
    bottom: 12px;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .page-number.left { left: 18px; }
  .page-number.right { right: 18px; }

  h1.hero { font-size: 24px; font-weight: 800; line-height: 1.2; color: #fff; }
  h2.section { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 6px; }
  h3.sub { font-size: 12px; font-weight: 600; color: var(--cyan); margin-bottom: 4px; }
  p.body { font-size: 11px; line-height: 1.6; color: var(--text); }
  p.small { font-size: 10px; line-height: 1.5; color: var(--muted); }

  /* Feature grid */
  .feat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    flex: 1;
  }

  .feat-card {
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 6px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .feat-card .icon { font-size: 16px; }
  .feat-card .label { font-size: 10px; font-weight: 600; color: var(--text); }
  .feat-card .desc { font-size: 9px; color: var(--muted); line-height: 1.4; }

  /* Stats row */
  .stats-row {
    display: flex;
    gap: 8px;
  }

  .stat-box {
    flex: 1;
    background: rgba(0,255,136,0.04);
    border: 1px solid rgba(0,255,136,0.2);
    border-radius: 8px;
    padding: 8px 6px;
    text-align: center;
  }

  .stat-box .num {
    font-size: 20px;
    font-weight: 800;
    color: var(--green);
    line-height: 1;
  }

  .stat-box .lbl {
    font-size: 9px;
    color: var(--muted);
    margin-top: 3px;
    line-height: 1.3;
  }

  /* Tag pills */
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .tag {
    padding: 3px 8px;
    border-radius: 20px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .tag.cyan { background: rgba(0,229,255,0.12); color: var(--cyan); border: 1px solid rgba(0,229,255,0.3); }
  .tag.green { background: rgba(0,255,136,0.1); color: var(--green); border: 1px solid rgba(0,255,136,0.25); }
  .tag.purple { background: rgba(124,58,237,0.15); color: #a78bfa; border: 1px solid rgba(124,58,237,0.35); }
  .tag.red { background: rgba(255,76,106,0.1); color: var(--red); border: 1px solid rgba(255,76,106,0.25); }
  .tag.orange { background: rgba(255,140,0,0.1); color: var(--orange); border: 1px solid rgba(255,140,0,0.25); }

  /* Timeline / list */
  .list-items { display: flex; flex-direction: column; gap: 6px; }

  .list-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 6px 8px;
    background: rgba(255,255,255,0.02);
    border-radius: 5px;
    border-left: 2px solid var(--cyan);
  }

  .list-item .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--cyan);
    margin-top: 4px;
    flex-shrink: 0;
  }

  .list-item .text { font-size: 10px; line-height: 1.5; color: var(--text); }

  /* Progress bar */
  .progress-row { display: flex; flex-direction: column; gap: 5px; }

  .progress-item { display: flex; flex-direction: column; gap: 2px; }

  .progress-label { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); }

  .progress-bar {
    height: 4px;
    background: rgba(255,255,255,0.07);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--green));
  }

  /* Cover page */
  .cover-bg {
    background: linear-gradient(135deg, #050f1f 0%, #0a1e40 50%, #051228 100%) !important;
  }

  .cover-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 70% 30%, rgba(0,229,255,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 20% 80%, rgba(124,58,237,0.08) 0%, transparent 50%);
    pointer-events: none;
  }

  .cover-logo {
    width: 48px; height: 48px;
    border-radius: 12px;
    background: linear-gradient(135deg, #0a2a50, #1a4a80);
    border: 1px solid var(--cyan);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    position: relative;
    z-index: 1;
    box-shadow: 0 0 20px rgba(0,229,255,0.3);
  }

  .cover-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,229,255,0.08);
    border: 1px solid rgba(0,229,255,0.25);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--cyan);
    position: relative; z-index: 1;
  }

  .cover-badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .hex-grid {
    position: absolute;
    bottom: 30px; right: 0;
    width: 160px; height: 140px;
    opacity: 0.08;
    z-index: 0;
  }

  /* Architecture diagram */
  .arch-layer {
    background: rgba(0,229,255,0.03);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 6px;
    padding: 6px 10px;
  }

  .arch-layer .layer-title {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: 4px;
  }

  .arch-layer .layer-items {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  /* Navigation */
  #nav {
    position: relative;
    z-index: 10;
    margin-top: 28px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .nav-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(10,22,40,0.8);
    color: var(--cyan);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    backdrop-filter: blur(10px);
  }

  .nav-btn:hover {
    background: rgba(0,229,255,0.1);
    border-color: var(--cyan);
    box-shadow: 0 0 15px rgba(0,229,255,0.2);
  }

  .nav-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .page-dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .page-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--border);
    transition: all 0.3s;
    cursor: pointer;
  }

  .page-dot.active {
    background: var(--cyan);
    width: 18px;
    border-radius: 3px;
    box-shadow: 0 0 8px rgba(0,229,255,0.5);
  }

  /* Header */
  #header {
    position: relative;
    z-index: 10;
    margin-bottom: 20px;
    text-align: center;
  }

  #header h1 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }

  #header span {
    color: var(--cyan);
  }

  /* Divider */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 4px 0;
  }

  /* Double-spread layout helpers */
  .spread { display: flex; gap: 0; height: 100%; }

  /* Shimmer for cover */
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .shimmer-line {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.03) 50%, transparent 100%);
    animation: shimmer 3s infinite;
  }

  /* Tooltip on hover */
  #tip {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    z-index: 20;
    opacity: 1;
    transition: opacity 0.5s;
  }

  #tip.hidden { opacity: 0; }
</style>
</head>
<body>

<div id="header">
  <h1>Enterprise <span>Omni-Agent</span> AI Platform &nbsp;·&nbsp; <span>Exafluence Inc.</span> &nbsp;·&nbsp; Edition 2030</h1>
</div>

<div id="scene">
  <div id="book">

    <!-- Static right half background -->
    <div id="right-cover">
      <div id="right-cover-inner" id="right-inner"></div>
    </div>

    <!-- Spine -->
    <div id="spine"></div>

    <!-- Pages (added dynamically) -->

  </div>
  <div id="book-shadow"></div>
</div>

<div id="nav">
  <button class="nav-btn" id="btn-prev" onclick="turnPrev()">&#8592;</button>
  <div class="page-dots" id="dots"></div>
  <button class="nav-btn" id="btn-next" onclick="turnNext()">&#8594;</button>
</div>

<div id="tip">Click arrows or dots to turn pages &nbsp;·&nbsp; Use keyboard ← →</div>

<script>
// ─── Page content definitions ───────────────────────────────────────────────

const PAGES = [
  // Page 0 — COVER (front)
  {
    front: `
      <div class="page-face cover-bg">
        <div class="shimmer-line"></div>
        <svg class="hex-grid" viewBox="0 0 160 140" fill="none">
          ${Array.from({length:15}, (_,i) => {
            const x = (i%5)*32+16, y = Math.floor(i/5)*40+(i%2?20:0);
            return `<polygon points="${x},${y-12} ${x+10},${y-6} ${x+10},${y+6} ${x},${y+12} ${x-10},${y+6} ${x-10},${y-6}" stroke="#00e5ff" stroke-width="1" fill="none" opacity="0.6"/>`;
          }).join('')}

        <div style="position:relative;z-index:1;display:flex;flex-direction:column;gap:16px;height:100%">

          <div class="cover-badge">Live Platform — All Systems Go</div>
          <h1 class="hero" style="font-size:20px;line-height:1.25;color:#fff">Enterprise<br><span style="color:var(--cyan)">Omni-Agent</span><br>AI Platform</h1>
          <div class="divider"></div>
          <p class="small" style="color:var(--muted);font-size:10px;line-height:1.6">

          <div class="stats-row" style="margin-top:auto">

          </div>
          <p class="page-number right">1</p>
        </div>
      </div>`,
    back: `

        <p class="page-title">Platform Overview</p>

        <p class="body" style="font-size:10px">
          A fully integrated, AI-native cybersecurity operating system that deploys autonomous agents across your entire infrastructure — collecting telemetry, hunting threats, remediating vulnerabilities, and orchestrating response — all without human intervention.

        </div>
        <div style="margin-top:auto">
          <div class="tags">
            <span class="tag cyan">FastAPI</span>
            <span class="tag cyan">React</span>
            <span class="tag green">MongoDB</span>
            <span class="tag purple">Socket.IO</span>
            <span class="tag orange">Python 3.11+</span>
          </div>
        </div>
        <p class="page-number left">2</p>
      </div>`
  },

  // Page 1 — Agent Fleet
  {
    front: `

    back: `

          ${[

            ['EDR Real-time Telemetry', 96],

          <div class="progress-item">

          </div>`).join('')}
        </div>
        <p class="page-number left">4</p>
      </div>`
  },

  // Page 2 — EDR / UEBA / SIEM
  {
    front: `

        <h2 class="section">EDR · UEBA · SIEM</h2>

        </div>
        <div class="divider" style="margin-top:8px"></div>

// ─── Book engine ─────────────────────────────────────────────────────────────

const book = document.getElementById('book');
const rightInner = document.getElementById('right-cover-inner');
const dotsEl = document.getElementById('dots');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const tip = document.getElementById('tip');

let currentSpread = 0; // 0 = cover showing
const totalSpreads = PAGES.length; // each PAGES entry = one left page (front+back)

// Create page elements
const pageEls = PAGES.map((pg, i) => {
  const el = document.createElement('div');
  el.className = 'page';
  el.style.left = '0';
  el.style.zIndex = totalSpreads - i;
  el.innerHTML = `<div class="front">${pg.front}</div><div class="back">${pg.back}</div>`;
  book.appendChild(el);
  return el;
});

// Create dots
PAGES.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'page-dot';
  d.onclick = () => goToSpread(i);
  dotsEl.appendChild(d);
});

function updateDots() {
  const dots = dotsEl.querySelectorAll('.page-dot');
  dots.forEach((d, i) => {
    d.classList.toggle('active', i === currentSpread);
  });
}

function updateButtons() {
  btnPrev.disabled = currentSpread === 0;
  btnNext.disabled = currentSpread === totalSpreads - 1;
}

function showRightPage(spreadIndex) {
  // The right side shows the "back" of the PREVIOUS page (the page that has been turned)
  // or the next page's front if available
  if (spreadIndex < totalSpreads) {
    rightInner.innerHTML = PAGES[spreadIndex].back;
  } else {
    rightInner.innerHTML = '';
  }
}

function goToSpread(target) {
  if (target === currentSpread) return;

  if (target > currentSpread) {
    // Turn forward
    for (let i = currentSpread; i < target; i++) {
      pageEls[i].classList.add('turned');
      pageEls[i].style.zIndex = i + 1;
    }
  } else {
    // Turn back
    for (let i = currentSpread - 1; i >= target; i--) {
      pageEls[i].classList.remove('turned');
      pageEls[i].style.zIndex = totalSpreads - i;
    }
  }

  currentSpread = target;
  showRightPage(currentSpread);
  updateDots();
  updateButtons();
}

function turnNext() {
  if (currentSpread < totalSpreads - 1) goToSpread(currentSpread + 1);
}

function turnPrev() {
  if (currentSpread > 0) goToSpread(currentSpread - 1);
}

// Initial state
showRightPage(0);
updateDots();
updateButtons();

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') turnNext();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') turnPrev();
});

// Hide tip after 5 seconds
setTimeout(() => tip.classList.add('hidden'), 5000);

// Subtle book tilt on mouse move
document.addEventListener('mousemove', e => {
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  const dx = (e.clientX - cx) / cx;
  const dy = (e.clientY - cy) / cy;
  book.style.transform = `rotateX(${-dy * 3}deg) rotateY(${dx * 5}deg)`;
});

document.addEventListener('mouseleave', () => {
  book.style.transform = '';
});
</script>
</body>
</html>
