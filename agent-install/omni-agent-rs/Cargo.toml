[package]
name = "omni-agent"
version = "2.1.6"
edition = "2021"
description = "Enterprise Omni Agent - AI-Powered Security Agent"
authors = ["Enterprise Omni Agent"]

[lib]
name = "omni_agent"
path = "src/lib.rs"

[[bin]]
name = "omni-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
# TLS backend decision (RUST-01): default-features is disabled to exclude reqwest's
# rustls default-tls stack (rustls + aws-lc-rs), since native-tls is the single chosen
# backend. charset/http2/system-proxy are re-listed explicitly to retain the prior
# default behavior that default-features=true used to provide.
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "native-tls", "charset", "http2", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
bincode = "1"
rand = "0.8"
dirs = "5"
sysinfo = "0.39"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "1.0"
# Phase 50 (NSCAN): verify the ed25519-signed feed bundle offline (pure Rust, no C deps).
ed25519-dalek = { version = "2", features = ["rand_core"] }
log = "0.4"
simplelog = "0.12"
hostname = "0.4"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
notify = "8"
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = { version = "0.3", features = ["sink"] }
once_cell = "1.19"
# Phase 66 (NSCAN YARA engine): real YARA rule compilation/evaluation for
# native file scanning. Pulls in wasmtime+cranelift (JIT) — a deliberate,
# accepted reversal of Phase 50's decision to avoid that dependency; see the
# ENGINE NOTE in capabilities/security_scan.rs. Re-verify cross-compile
# targets before shipping.
yara-x = "1.19.0"
# Phase 64 (rotate_key): SSH authorized_keys parse/generate/fingerprint (pure Rust, no C deps).
ssh-key = { version = "0.6.7", default-features = false, features = ["alloc", "std", "rand_core", "ed25519", "rsa", "dsa"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-service = "0.7"
winapi = { version = "0.3", features = [
    "minwindef", "winnt", "handleapi", "errhandlingapi", "processthreadsapi",
    "securitybaseapi", "userenv", "winbase", "wtsapi32",
] }

# Phase 65 (FIM fanotify): fanotify is a Linux kernel API with no macOS/Windows
# equivalent, so this stays out of the unconditional [dependencies] graph
# (cfg(unix) would still try to build it for macOS, which also lacks fanotify).
[target.'cfg(target_os = "linux")'.dependencies]
naughtyfy = "0.2.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[profile.release]
opt-level = 3
# Fat LTO (lto = true) makes the final crate's link step die in this build
# environment — reproducible on both the Windows cross-target (mingw-w64 GNU
# ld) and a native x86_64-unknown-linux-gnu host build, silently, with no OOM
# trace in dmesg/journalctl. Thin LTO reliably succeeds on both and still
# gets most of the size/perf win. Set here (not via rustflags) because
# rustflags-based `-C lto` conflicts with Cargo's own `-C embed-bitcode=no`
# on build-script/proc-macro compilation units whenever host == target (i.e.
# any native, non-cross-compiled build) — Cargo's profile-level `lto` field
# is understood specially and never misapplied to those units, so it's
# correct for every target uniformly instead of needing a per-target
# rustflags override (see agent-install/omni-agent-rs/.cargo/config.toml
# history for the rustflags approach this replaced).
lto = "thin"
strip = true
